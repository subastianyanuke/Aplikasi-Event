<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Event Ticketing</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --border: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow-x: hidden;
        }

        #login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top center, #1e293b, #0f172a);
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .login-card h2 { margin-bottom: 20px; color: var(--accent); }
        
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent); }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: var(--accent-hover); }
        button.btn-danger { background: var(--danger); width: auto; padding: 8px 12px; font-size: 12px;}
        button.btn-success { background: var(--success); width: auto; padding: 8px 12px; font-size: 12px;}
        button.btn-edit { background: var(--warning); width: auto; padding: 8px 12px; font-size: 12px;}

        #app-section { display: none; width: 100%; }
        .sidebar {
            width: 250px;
            background: var(--bg-card);
            height: 100vh;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar h1 { text-align: center; color: var(--accent); font-size: 20px; margin-bottom: 30px; }
        .nav-item {
            padding: 15px 25px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.3s;
            border-left: 4px solid transparent;
        }
        .nav-item:hover, .nav-item.active { background: var(--bg-input); color: var(--text-primary); border-left-color: var(--accent); }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .header h2 { font-size: 24px; }
        .btn-add { background: var(--success); width: auto; padding: 10px 20px; }

        .table-container {
            background: var(--bg-card);
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid var(--border);
        }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; white-space: nowrap; }
        th { background: var(--bg-input); color: var(--text-secondary); font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.03); }
        td:last-child { display: flex; gap: 8px; }

        .modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); justify-content: center; align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .modal { background: var(--bg-card); padding: 30px; border-radius: 8px; width: 100%; max-width: 500px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        .modal h3 { margin-bottom: 20px; color: var(--accent); }
        .form-group { flex: 1; margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 12px; color: var(--text-secondary); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: var(--bg-input); width: 100%; }
        .btn-save { background: var(--accent); width: 100%; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-active { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-inactive { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

        .toast {
            position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white;
            padding: 15px 25px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none; z-index: 200;
            transition: 0.3s;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #app-section { flex-direction: column; }
            .sidebar {
                width: 100%; height: auto; flex-direction: row; overflow-x: auto;
                padding: 10px; border-right: none; border-bottom: 1px solid var(--border);
            }
            .sidebar h1 { display: none; }
            .nav-item { padding: 10px 15px; border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
            .nav-item:hover, .nav-item.active { border-bottom-color: var(--accent); border-left: none; }
            .main-content { padding: 20px; width: 100%; }
            .header h2 { font-size: 20px; }
            .table-container { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="login-section">
        <div class="login-card">
            <h2>ADMIN LOGIN</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="checkLogin()">Login</button>
        </div>
    </div>

    <div id="app-section">
        <div class="sidebar">
            <h1>EVENT PANEL</h1>
            <div class="nav-item active" onclick="switchPage('data-event', this)">DATA EVENT</div>
            <div class="nav-item" onclick="switchPage('input-produk', this)">INPUT PRODUK</div>
            <div class="nav-item" onclick="switchPage('data-pesanan', this)">DATA PESANAN</div>
            <div class="nav-item" onclick="switchPage('laporan', this)">LAPORAN PENJUALAN</div>
        </div>
        <div class="main-content">
            <div id="page-content"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Form</h3>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Batal</button>
                <button class="btn-save" id="btn-save-modal" onclick="saveData()">Simpan</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwY0YM37hg_iRaLqrWbdU5tMApCFv2CTtNQ20ItDwcHFtHhle27dOkVdI8Ak82imeZt/exec'; 
    const VALID_USER = "Tian_XIRPL";
    const VALID_PASS = "qwerty";

    let currentSheet = '';
    let currentAction = '';
    let currentEditId = '';
    let autoRefreshInterval;

    function checkLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        if (u === VALID_USER && p === VALID_PASS) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'flex';
            switchPage('data-event', document.querySelector('.nav-item'));
            startAutoRefresh();
        } else {
            alert('Username atau Password salah!');
        }
    }

    function switchPage(page, elem) {
        document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
        elem.classList.add('active');
        
        const content = document.getElementById('page-content');
        
        if (page === 'data-event') {
            currentSheet = 'Sheet1';
            content.innerHTML = `
                <div class="header">
                    <h2>Data Event</h2>
                    <button class="btn-add" onclick="openModal('add-event')">+ Tambah Event</button>
                </div>
                <div class="table-container"><table id="table-event"><thead><tr>
                    <th>ID Event</th><th>Nama Event</th><th>Tanggal</th><th>Lokasi</th><th>Deskripsi</th><th>Status</th><th>Aksi</th>
                </tr></thead><tbody></tbody></table></div>`;
            loadData('Sheet1');
        } else if (page === 'input-produk') {
            currentSheet = 'Sheet2';
            content.innerHTML = `
                <div class="header">
                    <h2>Input Produk (Tiket)</h2>
                    <button class="btn-add" onclick="openModal('add-produk')">+ Tambah Tiket</button>
                </div>
                <div class="table-container"><table id="table-produk"><thead><tr>
                    <th>ID Tiket</th><th>ID Event</th><th>Nama Tiket</th><th>Harga</th><th>Kuota</th><th>Deskripsi</th><th>Status</th><th>Aksi</th>
                </tr></thead><tbody></tbody></table></div>`;
            loadData('Sheet2');
        } else if (page === 'data-pesanan') {
            currentSheet = 'Sheet3';
            content.innerHTML = `
                <div class="header">
                    <h2>Data Pesanan</h2>
                </div>
                <div class="table-container"><table id="table-pesanan"><thead><tr>
                    <th>ID Pesanan</th><th>ID Tiket</th><th>Nama Pemesan</th><th>Email</th><th>No HP</th><th>Jumlah</th><th>Total Harga</th><th>Tanggal</th><th>Status</th><th>Aksi</th>
                </tr></thead><tbody></tbody></table></div>`;
            loadData('Sheet3');
        } else if (page === 'laporan') {
            currentSheet = 'Sheet3';
            content.innerHTML = `
                <div class="header"><h2>Laporan Penjualan</h2></div>
                <div class="table-container"><table id="table-laporan"><thead><tr>
                    <th>ID Pesanan</th><th>Nama Pemesan</th><th>Total Harga</th><th>Status</th>
                </tr></thead><tbody></tbody></table></div>`;
            loadLaporan();
        }
    }

    async function loadData(sheetName) {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getData&sheet=${sheetName}`);
            const data = await res.json();
            if (data.success) renderTable(sheetName, data.data);
        } catch (err) {
            console.error('Error load:', err);
        }
    }

    async function loadLaporan() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet3`);
            const data = await res.json();
            if (data.success) {
                const tbody = document.querySelector('#table-laporan tbody');
                tbody.innerHTML = '';
                
                let totalLunas = 0;
                let totalPending = 0;
                let totalBatal = 0;
                
                data.data.forEach(row => {
                    let status = row.STATUS ? row.STATUS.toUpperCase() : '';
                    let harga = parseInt(row['TOTAL_HARGA'] || 0);
                    
                    // Hitung total berdasarkan status
                    if(status === 'LUNAS') totalLunas += harga;
                    else if(status === 'PENDING' || status === 'MENUNGGU') totalPending += harga;
                    else if(status === 'BATAL') totalBatal += harga;
                    
                    // Tentukan warna badge
                    let badgeClass = status === 'LUNAS' ? 'badge-active' : (status === 'BATAL' ? 'badge-inactive' : 'badge-warning');
                    
                    tbody.innerHTML += `<tr>
                        <td>${row.ID_PESANAN}</td>
                        <td>${row.NAMA_PEMESAN}</td>
                        <td>Rp ${harga.toLocaleString('id-ID')}</td>
                        <td><span class="badge ${badgeClass}">${status}</span></td>
                    </tr>`;
                });
                
                // Tampilkan rekapitulasi di bawah tabel
                tbody.innerHTML += `<tr style="background:rgba(16, 185, 129, 0.2); font-weight:bold; color: var(--success);">
                    <td colspan="2">TOTAL PENDAPATAN (LUNAS)</td>
                    <td>Rp ${totalLunas.toLocaleString('id-ID')}</td>
                    <td></td>
                </tr>`;
                tbody.innerHTML += `<tr style="background:rgba(245, 158, 11, 0.2); font-weight:bold; color: var(--warning);">
                    <td colspan="2">TOTAL PENDING (BELUM DIBAYAR)</td>
                    <td>Rp ${totalPending.toLocaleString('id-ID')}</td>
                    <td></td>
                </tr>`;
                tbody.innerHTML += `<tr style="background:rgba(239, 68, 68, 0.2); font-weight:bold; color: var(--danger);">
                    <td colspan="2">TOTAL BATAL (DIBATALKAN)</td>
                    <td>Rp ${totalBatal.toLocaleString('id-ID')}</td>
                    <td></td>
                </tr>`;
            }
        } catch (err) {
            console.error('Error laporan:', err);
        }
    }

    function renderTable(sheetName, data) {
        let tbody;
        if (sheetName === 'Sheet1') {
            tbody = document.querySelector('#table-event tbody');
            tbody.innerHTML = '';
            data.forEach(row => {
                let statusClass = row.STATUS === 'AKTIF' ? 'badge-active' : 'badge-inactive';
                tbody.innerHTML += `<tr>
                    <td>${row.ID_EVENT}</td>
                    <td>${row.NAMA_EVENT}</td>
                    <td>${row.TANGGAL}</td>
                    <td>${row.LOKASI}</td>
                    <td>${row.DESKRIPSI_ACARA}</td>
                    <td><span class="badge ${statusClass}">${row.STATUS}</span></td>
                    <td>
                        <button class="btn-edit" onclick="openModal('edit-event', '${row.ID_EVENT}')">Edit</button>
                        <button class="btn-danger" onclick="deleteRecord('Sheet1', 'ID_EVENT', '${row.ID_EVENT}')">Hapus</button>
                    </td>
                </tr>`;
            });
        } else if (sheetName === 'Sheet2') {
            tbody = document.querySelector('#table-produk tbody');
            tbody.innerHTML = '';
            data.forEach(row => {
                let statusClass = row.STATUS === 'AKTIF' ? 'badge-active' : 'badge-inactive';
                tbody.innerHTML += `<tr>
                    <td>${row.ID_TIKET}</td>
                    <td>${row.ID_EVENT}</td>
                    <td>${row.NAMA_TIKET}</td>
                    <td>Rp ${parseInt(row.HARGA || 0).toLocaleString('id-ID')}</td>
                    <td>${row.KUOTA}</td>
                    <td>${row.DESKRIPSI}</td>
                    <td><span class="badge ${statusClass}">${row.STATUS}</span></td>
                    <td>
                        <button class="btn-edit" onclick="openModal('edit-produk', '${row.ID_TIKET}')">Edit</button>
                        <button class="btn-danger" onclick="deleteRecord('Sheet2', 'ID_TIKET', '${row.ID_TIKET}')">Hapus</button>
                    </td>
                </tr>`;
            });
        } else if (sheetName === 'Sheet3') {
            tbody = document.querySelector('#table-pesanan tbody');
            tbody.innerHTML = '';
            data.forEach(row => {
                let status = row.STATUS ? row.STATUS.toUpperCase() : '';
                let badgeClass = status === 'LUNAS' ? 'badge-active' : (status === 'BATAL' ? 'badge-inactive' : 'badge-warning');
                tbody.innerHTML += `<tr>
                    <td>${row.ID_PESANAN}</td>
                    <td>${row.ID_TIKET}</td>
                    <td>${row.NAMA_PEMESAN}</td>
                    <td>${row.EMAIL}</td>
                    <td>${row.NO_HP}</td>
                    <td>${row.JUMLAH}</td>
                    <td>Rp ${parseInt(row['TOTAL_HARGA'] || 0).toLocaleString('id-ID')}</td>
                    <td>${row['TANGGAL PESAN']}</td>
                    <td><span class="badge ${badgeClass}">${status}</span></td>
                    <td>
                        <button class="btn-edit" onclick="openModal('edit-pesanan', '${row.ID_PESANAN}')">Edit</button>
                        <button class="btn-danger" onclick="deleteRecord('Sheet3', 'ID_PESANAN', '${row.ID_PESANAN}')">Hapus</button>
                    </td>
                </tr>`;
            });
        }
    }

    async function openModal(action, id = '') {
        currentAction = action;
        currentEditId = id;
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        
        if (action === 'add-event') {
            modalTitle.innerText = "Tambah Event";
            modalBody.innerHTML = `
                <div class="form-group"><label>ID Event *</label><input type="text" id="m_ID_EVENT" placeholder="EVT001"></div>
                <div class="form-group"><label>Nama Event *</label><input type="text" id="m_NAMA_EVENT"></div>
                <div class="form-group"><label>Tanggal</label><input type="date" id="m_TANGGAL"></div>
                <div class="form-group"><label>Lokasi</label><input type="text" id="m_LOKASI"></div>
                <div class="form-group"><label>Deskripsi</label><input type="text" id="m_DESKRIPSI_ACARA"></div>
                <div class="form-group"><label>Status</label>
                    <select id="m_STATUS"><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select>
                </div>`;
        } else if (action === 'edit-event') {
            modalTitle.innerText = "Edit Event";
            modalBody.innerHTML = `<p>Memuat data...</p>`;
            fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet1`).then(r=>r.json()).then(res=>{
                const d = res.data.find(x => x.ID_EVENT === id);
                modalBody.innerHTML = `
                    <div class="form-group"><label>ID Event (Tidak bisa diubah)</label><input type="text" id="m_ID_EVENT" value="${d.ID_EVENT}" disabled></div>
                    <div class="form-group"><label>Nama Event *</label><input type="text" id="m_NAMA_EVENT" value="${d.NAMA_EVENT}"></div>
                    <div class="form-group"><label>Tanggal</label><input type="date" id="m_TANGGAL" value="${d.TANGGAL}"></div>
                    <div class="form-group"><label>Lokasi</label><input type="text" id="m_LOKASI" value="${d.LOKASI}"></div>
                    <div class="form-group"><label>Deskripsi</label><input type="text" id="m_DESKRIPSI_ACARA" value="${d.DESKRIPSI_ACARA}"></div>
                    <div class="form-group"><label>Status</label>
                        <select id="m_STATUS">
                            <option value="AKTIF" ${d.STATUS==='AKTIF'?'selected':''}>AKTIF</option>
                            <option value="NONAKTIF" ${d.STATUS==='NONAKTIF'?'selected':''}>NONAKTIF</option>
                        </select>
                    </div>`;
            });
        }
        else if (action === 'add-produk' || action === 'edit-produk') {
            modalTitle.innerText = action === 'add-produk' ? "Tambah Tiket" : "Edit Tiket";
            modalBody.innerHTML = `<p>Memuat data event...</p>`;
            
            const [resEvent, resTiket] = await Promise.all([
                fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet1`).then(r => r.json()),
                fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet2`).then(r => r.json())
            ]);

            const events = resEvent.success ? resEvent.data : [];
            let d = null;
            if (action === 'edit-produk' && resTiket.success) {
                d = resTiket.data.find(x => x.ID_TIKET === id);
            }

            let eventOptions = '<option value="">Pilih Event...</option>';
            events.forEach(ev => {
                const selected = (d && d.ID_EVENT === ev.ID_EVENT) ? 'selected' : '';
                eventOptions += `<option value="${ev.ID_EVENT}" ${selected}>${ev.ID_EVENT} - ${ev.NAMA_EVENT}</option>`;
            });

            modalBody.innerHTML = `
                <div class="form-group"><label>ID Tiket *</label><input type="text" id="m_ID_TIKET" value="${d?d.ID_TIKET:''}" ${d?'disabled':''} placeholder="TKT001"></div>
                <div class="form-group">
                    <label>Pilih Event (ID Event) *</label>
                    <select id="m_ID_EVENT">${eventOptions}</select>
                </div>
                <div class="form-group"><label>Nama Tiket *</label><input type="text" id="m_NAMA_TIKET" value="${d?d.NAMA_TIKET:''}"></div>
                <div class="form-group"><label>Harga</label><input type="number" id="m_HARGA" value="${d?d.HARGA:''}"></div>
                <div class="form-group"><label>Kuota</label><input type="number" id="m_KUOTA" value="${d?d.KUOTA:''}"></div>
                <div class="form-group"><label>Deskripsi</label><input type="text" id="m_DESKRIPSI" value="${d?d.DESKRIPSI:''}"></div>
                <div class="form-group"><label>Status</label>
                    <select id="m_STATUS">
                        <option value="AKTIF" ${d&&d.STATUS==='AKTIF'?'selected':''}>AKTIF</option>
                        <option value="NONAKTIF" ${d&&d.STATUS==='NONAKTIF'?'selected':''}>NONAKTIF</option>
                    </select>
                </div>`;
        }
        else if (action === 'edit-pesanan') {
            modalTitle.innerText = "Edit Status Pesanan";
            modalBody.innerHTML = `<p>Memuat data...</p>`;
            fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet3`).then(r=>r.json()).then(res=>{
                const d = res.data.find(x => x.ID_PESANAN === id);
                modalBody.innerHTML = `
                    <div class="form-group"><label>Nama Pemesan *</label><input type="text" id="m_NAMA_PEMESAN" value="${d.NAMA_PEMESAN}"></div>
                    <div class="form-group"><label>Email</label><input type="text" id="m_EMAIL" value="${d.EMAIL}"></div>
                    <div class="form-group"><label>No HP</label><input type="text" id="m_NO_HP" value="${d.NO_HP}"></div>
                    <div class="form-group"><label>Jumlah</label><input type="number" id="m_JUMLAH" value="${d.JUMLAH}"></div>
                    <div class="form-group"><label>Status</label>
                        <select id="m_STATUS">
                            <option value="PENDING" ${d.STATUS==='PENDING'?'selected':''}>PENDING</option>
                            <option value="LUNAS" ${d.STATUS==='LUNAS'?'selected':''}>LUNAS</option>
                            <option value="BATAL" ${d.STATUS==='BATAL'?'selected':''}>BATAL</option>
                        </select>
                    </div>`;
            });
        }
        
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    async function saveData() {
        let payload = {};
        let postBody = {};

        if (currentAction === 'add-event') {
            const idEvent = document.getElementById('m_ID_EVENT').value.trim();
            const namaEvent = document.getElementById('m_NAMA_EVENT').value.trim();
            if (!idEvent || !namaEvent) {
                showToast("Gagal: ID Event dan Nama Event wajib diisi!", "error");
                return;
            }
            payload = {
                ID_EVENT: idEvent,
                NAMA_EVENT: namaEvent,
                TANGGAL: document.getElementById('m_TANGGAL').value,
                LOKASI: document.getElementById('m_LOKASI').value,
                DESKRIPSI_ACARA: document.getElementById('m_DESKRIPSI_ACARA').value,
                STATUS: document.getElementById('m_STATUS').value
            };
            postBody = { action: 'addData', sheet: 'Sheet1', payload: payload };
        } 
        else if (currentAction === 'edit-event') {
            const namaEvent = document.getElementById('m_NAMA_EVENT').value.trim();
            if (!namaEvent) {
                showToast("Gagal: Nama Event wajib diisi!", "error");
                return;
            }
            payload = {
                NAMA_EVENT: namaEvent,
                TANGGAL: document.getElementById('m_TANGGAL').value,
                LOKASI: document.getElementById('m_LOKASI').value,
                DESKRIPSI_ACARA: document.getElementById('m_DESKRIPSI_ACARA').value,
                STATUS: document.getElementById('m_STATUS').value
            };
            postBody = { action: 'updateData', sheet: 'Sheet1', idCol: 'ID_EVENT', idVal: currentEditId, payload: payload };
        }
        else if (currentAction === 'add-produk') {
            const idTiket = document.getElementById('m_ID_TIKET').value.trim();
            const idEvent = document.getElementById('m_ID_EVENT').value.trim();
            const namaTiket = document.getElementById('m_NAMA_TIKET').value.trim();
            if (!idTiket || !idEvent || !namaTiket) {
                showToast("Gagal: ID Tiket, Event, dan Nama Tiket wajib diisi!", "error");
                return;
            }
            payload = {
                ID_TIKET: idTiket,
                ID_EVENT: idEvent, 
                NAMA_TIKET: namaTiket,
                HARGA: document.getElementById('m_HARGA').value,
                KUOTA: document.getElementById('m_KUOTA').value,
                DESKRIPSI: document.getElementById('m_DESKRIPSI').value,
                STATUS: document.getElementById('m_STATUS').value
            };
            postBody = { action: 'addData', sheet: 'Sheet2', payload: payload };
        }
        else if (currentAction === 'edit-produk') {
            const idEvent = document.getElementById('m_ID_EVENT').value.trim();
            const namaTiket = document.getElementById('m_NAMA_TIKET').value.trim();
            if (!idEvent || !namaTiket) {
                showToast("Gagal: Event dan Nama Tiket wajib diisi!", "error");
                return;
            }
            payload = {
                ID_EVENT: idEvent, 
                NAMA_TIKET: namaTiket,
                HARGA: document.getElementById('m_HARGA').value,
                KUOTA: document.getElementById('m_KUOTA').value,
                DESKRIPSI: document.getElementById('m_DESKRIPSI').value,
                STATUS: document.getElementById('m_STATUS').value
            };
            postBody = { action: 'updateData', sheet: 'Sheet2', idCol: 'ID_TIKET', idVal: currentEditId, payload: payload };
        }
        else if (currentAction === 'edit-pesanan') {
            const namaPemesan = document.getElementById('m_NAMA_PEMESAN').value.trim();
            if (!namaPemesan) {
                showToast("Gagal: Nama Pemesan wajib diisi!", "error");
                return;
            }
            payload = {
                NAMA_PEMESAN: namaPemesan,
                EMAIL: document.getElementById('m_EMAIL').value,
                NO_HP: document.getElementById('m_NO_HP').value,
                JUMLAH: document.getElementById('m_JUMLAH').value,
                STATUS: document.getElementById('m_STATUS').value
            };
            postBody = { action: 'updateData', sheet: 'Sheet3', idCol: 'ID_PESANAN', idVal: currentEditId, payload: payload };
        }

        try {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(postBody)
            });
            const data = await res.json();
            if(data.success) {
                showToast(data.message, "success");
                closeModal();
                loadData(currentSheet);
            } else {
                showToast("Error: " + data.message, "error");
            }
        } catch (err) {
            showToast("Gagal terhubung ke server.", "error");
        }
    }

    async function deleteRecord(sheet, idCol, idVal) {
        let confirmDelete = confirm(`Yakin hapus data ${idVal}? Data yang berhubungan juga akan terhapus.`);
        if (!confirmDelete) return;

        if (sheet === 'Sheet1') {
            try {
                const resTiket = await fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet2`);
                const dataTiket = await resTiket.json();
                if (dataTiket.success) {
                    const relatedTickets = dataTiket.data.filter(t => String(t.ID_EVENT).toLowerCase() === String(idVal).toLowerCase());
                    for (let i = relatedTickets.length - 1; i >= 0; i--) {
                        let t = relatedTickets[i];
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'deleteData', sheet: 'Sheet2', idCol: 'ID_TIKET', idVal: t.ID_TIKET })
                        });
                    }
                }
            } catch(e) { console.error("Gagal hapus relasi tiket", e); }
        }

        if (sheet === 'Sheet2') {
            try {
                const resPesanan = await fetch(`${SCRIPT_URL}?action=getData&sheet=Sheet3`);
                const dataPesanan = await resPesanan.json();
                if (dataPesanan.success) {
                    const relatedOrders = dataPesanan.data.filter(p => String(p.ID_TIKET).toLowerCase() === String(idVal).toLowerCase());
                    for (let i = relatedOrders.length - 1; i >= 0; i--) {
                        let p = relatedOrders[i];
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'deleteData', sheet: 'Sheet3', idCol: 'ID_PESANAN', idVal: p.ID_PESANAN })
                        });
                    }
                }
            } catch(e) { console.error("Gagal hapus relasi pesanan", e); }
        }

        try {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'deleteData', sheet: sheet, idCol: idCol, idVal: idVal })
            });
            const data = await res.json();
            if(data.success) {
                showToast("Data & relasi berhasil dihapus", "success");
                loadData(currentSheet);
            }
        } catch (err) {
            showToast("Gagal menghapus data utama.", "error");
        }
    }

    function startAutoRefresh() {
        autoRefreshInterval = setInterval(() => {
            const activePage = document.querySelector('.nav-item.active').textContent;
            if(activePage.includes('DATA EVENT')) loadData('Sheet1');
            else if(activePage.includes('INPUT PRODUK')) loadData('Sheet2');
            else if(activePage.includes('DATA PESANAN')) loadData('Sheet3');
            else if(activePage.includes('LAPORAN')) loadLaporan();
        }, 15000);
    }

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.background = type === 'error' ? 'var(--danger)' : 'var(--success)';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }
</script>
