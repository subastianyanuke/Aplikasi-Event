<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventix - Jual Tiket Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
        }
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .navbar-custom { background-color: var(--primary); }
        .navbar-custom .nav-link, .navbar-brand { color: white !important; }
        .nav-link.active { color: #ecf0f1 !important; font-weight: bold; border-bottom: 2px solid var(--accent); }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .btn-primary { background-color: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background-color: #2980b9; border-color: #2980b9; }
        .badge-status { font-size: 0.8rem; padding: 5px 10px; border-radius: 10px; }
        .login-container { max-width: 400px; margin: 100px auto; }
        .modal-header { background-color: var(--primary); color: white; }
    </style>
</head>
<body>

    <!-- Login View -->
    <div id="loginView" class="login-container">
        <div class="card p-4">
            <h3 class="text-center mb-4" style="color: var(--primary)">EVENTIX</h3>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="loginUsername" class="form-control" placeholder="Masukkan Username">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Masukkan Password">
            </div>
            <button class="btn btn-primary w-100" onclick="doLogin()">Login</button>
            <p class="text-muted text-center mt-3" style="font-size: 0.8rem">Gunakan username: Tian_XIRPL | pass: 12345</p>
        </div>
    </div>

    <!-- Main App View -->
    <div id="appView" style="display: none;">
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">EVENTIX</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" id="navEvent" href="#" onclick="showPage('eventPage')">EVENT</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="navRiwayat" href="#" onclick="showPage('riwayatPage')">RIWAYAT PESANAN</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="doLogout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <!-- Event Page -->
            <div id="eventPage">
                <h3 class="mb-4" style="color: var(--primary)">Daftar Event</h3>
                <div id="eventList" class="row">
                    <div class="text-center text-muted mt-5">Memuat data event...</div>
                </div>
            </div>

            <!-- Riwayat Pesanan Page -->
            <div id="riwayatPage" style="display:none;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 style="color: var(--primary)">Riwayat Pesanan</h3>
                    <button class="btn btn-sm btn-light" onclick="fetchRiwayat()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover bg-white" style="border-radius: 10px; overflow: hidden;">
                        <thead style="background-color: var(--primary); color: white;">
                            <tr>
                                <th>ID Pesanan</th>
                                <th>Nama Pemesan</th>
                                <th>Email</th>
                                <th>No HP</th>
                                <th>Jumlah</th>
                                <th>Total Harga</th>
                                <th>Tanggal Pesan</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="riwayatList">
                            <!-- Data riwayat di sini -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pilih Tiket -->
    <div class="modal fade" id="ticketModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Pilih Tiket untuk <span id="modalEventName"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="ticketList">
                    <!-- List tiket di sini -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div class="modal fade" id="checkoutModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Checkout Tiket</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="checkoutForm">
                        <input type="hidden" id="co_id_tiket">
                        <input type="hidden" id="co_harga">
                        <div class="mb-3">
                            <label class="form-label">Nama Tiket</label>
                            <input type="text" id="co_nama_tiket" class="form-control" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nama Pemesan</label>
                            <input type="text" id="co_nama" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="co_email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">No HP</label>
                            <input type="text" id="co_hp" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Jumlah Tiket</label>
                            <input type="number" id="co_jumlah" class="form-control" min="1" value="1" required oninput="hitungTotal()">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Total Harga (Rp)</label>
                            <input type="text" id="co_total" class="form-control" readonly>
                        </div>
                        <!-- TAMBAHAN: DROPDOWN STATUS PESANAN -->
                        <div class="mb-3">
                            <label class="form-label">Status Pesanan</label>
                            <select id="co_status" class="form-select" required>
                                <option value="Menunggu">Menunggu</option>
                                <option value="Lunas">Lunas</option>
                                <option value="Batal">Batal</option>
                            </select>
                        </div>
                        <button type="button" class="btn btn-primary w-100" onclick="prosesCheckout()">Bayar Sekarang</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Edit Status -->
    <div class="modal fade" id="editStatusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Status Pesanan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit_id_pesanan">
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select id="edit_status" class="form-select">
                            <option value="Menunggu">Menunggu</option>
                            <option value="Lunas">Lunas</option>
                            <option value="Batal">Batal</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-primary w-100" onclick="simpanEditStatus()">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // PASTE URL GOOGLE APPS SCRIPT ANDA DI SINI
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwY0YM37hg_iRaLqrWbdU5tMApCFv2CTtNQ20ItDwcHFtHhle27dOkVdI8Ak82imeZt/exec";

        let currentEventId = null;
        let autoRefreshInterval;

        // --- FUNGSI LOGIN ---
        function doLogin() {
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;

            if (u === "Tian_XIRPL" && p === "12345") {
                localStorage.setItem('isLoggedIn', 'true');
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('appView').style.display = 'block';
                initApp();
            } else {
                alert("Username atau Password salah!");
            }
        }

        function doLogout() {
            localStorage.removeItem('isLoggedIn');
            clearInterval(autoRefreshInterval);
            document.getElementById('appView').style.display = 'none';
            document.getElementById('loginView').style.display = 'block';
        }

        // --- INISIALISASI APP ---
        function initApp() {
            showPage('eventPage');
            fetchEvents();
            fetchRiwayat();
            // Auto refresh setiap 30 detik
            autoRefreshInterval = setInterval(() => {
                fetchEvents();
                fetchRiwayat();
            }, 30000);
        }

        function showPage(pageId) {
            document.getElementById('eventPage').style.display = 'none';
            document.getElementById('riwayatPage').style.display = 'none';
            document.getElementById(pageId).style.display = 'block';

            document.getElementById('navEvent').classList.remove('active');
            document.getElementById('navRiwayat').classList.remove('active');
            
            if (pageId === 'eventPage') document.getElementById('navEvent').classList.add('active');
            if (pageId === 'riwayatPage') document.getElementById('navRiwayat').classList.add('active');
        }

        // --- EVENT & TIKET ---
        async function fetchEvents() {
            const url = `${SCRIPT_URL}?action=getData&sheet=Sheet1`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                renderEvents(data.data || []);
            } catch (err) {
                console.error("Error fetch events:", err);
            }
        }

        function renderEvents(events) {
            const container = document.getElementById('eventList');
            if (!events.length) {
                container.innerHTML = `<div class="text-center text-muted mt-5">Tidak ada event tersedia.</div>`;
                return;
            }

            container.innerHTML = events.map(evt => {
                const safeEventName = (evt.NAMA_EVENT || "").replace(/'/g, "\\'");
                return `
                <div class="col-md-6 mb-4">
                    <div class="card h-100">
                        <div class="card-body d-flex flex-column">
                            <span class="badge bg-secondary mb-2 align-self-start">${evt.STATUS}</span>
                            <h4 class="card-title" style="color: var(--primary)">${evt.NAMA_EVENT}</h4>
                            <p class="text-muted mb-1"><i class="bi bi-calendar-event"></i> ${formatDate(evt.TANGGAL)}</p>
                            <p class="text-muted mb-2"><i class="bi bi-geo-alt"></i> ${evt.LOKASI}</p>
                            <p class="card-text flex-grow-1">${evt.DESKRIPSI_ACARA}</p>
                            <button class="btn btn-primary mt-3" onclick="openTicketModal('${evt.ID_EVENT}', '${safeEventName}')">
                                Lihat Tiket & Pesan
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function openTicketModal(eventId, eventName) {
            currentEventId = eventId;
            document.getElementById('modalEventName').innerText = eventName;
            const modal = new bootstrap.Modal(document.getElementById('ticketModal'));
            
            document.getElementById('ticketList').innerHTML = `<div class="text-center"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">Memuat tiket...</p></div>`;
            modal.show();

            const url = `${SCRIPT_URL}?action=getData&sheet=Sheet2`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                const tickets = (data.data || []).filter(t => {
                    return String(t.ID_EVENT).trim() === String(eventId).trim() && Number(t.KUOTA) > 0;
                });
                
                if (!tickets.length) {
                    document.getElementById('ticketList').innerHTML = `<div class="alert alert-warning text-center">Tiket tidak tersedia atau kuota telah habis untuk event ini.</div>`;
                    return;
                }

                document.getElementById('ticketList').innerHTML = tickets.map(t => `
                    <div class="card mb-3 shadow-sm border-light">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="mb-1" style="color: var(--primary)">${t.NAMA_TIKET}</h5>
                                <p class="mb-1 text-muted" style="font-size:0.9rem">${t.DESKRIPSI || ''}</p>
                                <p class="mb-1 fw-bold" style="color: var(--accent)">Rp ${Number(t.HARGA).toLocaleString('id-ID')}</p>
                                <span class="badge bg-light text-dark border">Sisa Kuota: ${t.KUOTA}</span>
                            </div>
                            <button class="btn btn-sm btn-primary" onclick="openCheckoutModal('${t.ID_TIKET}', '${t.NAMA_TIKET}', ${t.HARGA})">
                                Pesan Tiket
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error fetch tickets:", err);
                document.getElementById('ticketList').innerHTML = `<div class="alert alert-danger text-center">Gagal memuat tiket. Cek koneksi atau URL App Script.</div>`;
            }
        }

        // --- CHECKOUT ---
        function openCheckoutModal(idTiket, namaTiket, harga) {
            document.getElementById('co_id_tiket').value = idTiket;
            document.getElementById('co_nama_tiket').value = namaTiket;
            document.getElementById('co_harga').value = harga;
            document.getElementById('co_jumlah').value = 1;
            // Reset status ke default "Menunggu" setiap kali buka modal checkout
            document.getElementById('co_status').value = "Menunggu";
            
            hitungTotal();
            
            const ticketModal = bootstrap.Modal.getInstance(document.getElementById('ticketModal'));
            if (ticketModal) ticketModal.hide();
            
            const checkoutModal = new bootstrap.Modal(document.getElementById('checkoutModal'));
            checkoutModal.show();
        }

        function hitungTotal() {
            const jml = parseInt(document.getElementById('co_jumlah').value) || 0;
            const hrg = parseInt(document.getElementById('co_harga').value) || 0;
            document.getElementById('co_total').value = (jml * hrg).toLocaleString('id-ID');
        }

        async function prosesCheckout() {
            const payload = {
                ID_PESANAN: "TRX" + Date.now(),
                ID_TIKET: document.getElementById('co_id_tiket').value,
                NAMA_PEMESAN: document.getElementById('co_nama').value,
                EMAIL: document.getElementById('co_email').value,
                NO_HP: document.getElementById('co_hp').value,
                JUMLAH: parseInt(document.getElementById('co_jumlah').value),
                TOTAL_HARGA: parseInt(document.getElementById('co_harga').value) * parseInt(document.getElementById('co_jumlah').value),
                "TANGGAL PESAN": new Date().toLocaleDateString('id-ID'),
                // MENGAMBIL NILAI STATUS DARI DROPDOWN
                STATUS: document.getElementById('co_status').value
            };

            if (!payload.NAMA_PEMESAN || !payload.EMAIL || !payload.NO_HP) {
                alert("Lengkapi data terlebih dahulu!");
                return;
            }

            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'checkout', payload: payload }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            const data = await res.json();
            
            if (data.success) {
                alert(data.message);
                bootstrap.Modal.getInstance(document.getElementById('checkoutModal')).hide();
                fetchEvents();
                fetchRiwayat();
                showPage('riwayatPage');
            } else {
                alert("Error: " + data.message);
            }
        }

        // --- RIWAYAT PESANAN (CRUD READ, UPDATE, DELETE) ---
        async function fetchRiwayat() {
            const url = `${SCRIPT_URL}?action=getData&sheet=Sheet3`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                renderRiwayat(data.data || []);
            } catch (err) {
                console.error("Error fetch riwayat:", err);
            }
        }

        function renderRiwayat(data) {
            const tbody = document.getElementById('riwayatList');
            if (!data.length) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted">Belum ada pesanan.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(r => {
                let badgeColor = 'bg-warning text-dark';
                if (r.STATUS === 'Lunas') badgeColor = 'bg-success';
                if (r.STATUS === 'Batal') badgeColor = 'bg-danger';
                
                return `
                <tr>
                    <td>${r.ID_PESANAN}</td>
                    <td>${r.NAMA_PEMESAN}</td>
                    <td>${r.EMAIL}</td>
                    <td>${r.NO_HP}</td>
                    <td>${r.JUMLAH}</td>
                    <td>Rp ${Number(r.TOTAL_HARGA).toLocaleString('id-ID')}</td>
                    <td>${r["TANGGAL PESAN"]}</td>
                    <td><span class="badge ${badgeColor}">${r.STATUS}</span></td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="openEditStatus('${r.ID_PESANAN}', '${r.STATUS}')"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="deletePesanan('${r.ID_PESANAN}')"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
                `;
            }).join('');
        }

        function openEditStatus(id, status) {
            document.getElementById('edit_id_pesanan').value = id;
            document.getElementById('edit_status').value = status;
            new bootstrap.Modal(document.getElementById('editStatusModal')).show();
        }

        async function simpanEditStatus() {
            const id = document.getElementById('edit_id_pesanan').value;
            const status = document.getElementById('edit_status').value;
            
            const payload = { STATUS: status };
            const body = {
                action: 'updateData',
                sheet: 'Sheet3',
                idCol: 'ID_PESANAN',
                idVal: id,
                payload: payload
            };

            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(body),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            const data = await res.json();
            
            if (data.success) {
                bootstrap.Modal.getInstance(document.getElementById('editStatusModal')).hide();
                fetchRiwayat();
            } else {
                alert("Gagal update: " + data.message);
            }
        }

        async function deletePesanan(id) {
            if (!confirm("Yakin ingin menghapus pesanan ini?")) return;
            
            const body = {
                action: 'deleteData',
                sheet: 'Sheet3',
                idCol: 'ID_PESANAN',
                idVal: id
            };

            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(body),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            const data = await res.json();
            
            if (data.success) {
                fetchRiwayat();
            } else {
                alert("Gagal hapus: " + data.message);
            }
        }

        // --- UTILITIES ---
        function formatDate(dateString) {
            if (!dateString) return "-";
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
            } catch {
                return dateString;
            }
        }

        // --- CEK SESI LOGIN SAAT PAGE LOAD ---
        window.onload = () => {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('appView').style.display = 'block';
                initApp();
            } else {
                document.getElementById('loginView').style.display = 'block';
                document.getElementById('appView').style.display = 'none';
            }
        };
    </script>
</body>
</html>
